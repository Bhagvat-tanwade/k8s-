apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_NAME: "myapp"
  LOG_LEVEL: "INFO"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"


  ---


  apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  USERNAME: YWRtaW4=
  PASSWORD: cGFzc3dvcmQxMjM=



ConfigMap and Secret in a Deployment

  apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: nginx:latest
        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_NAME

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST

        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: USERNAME

        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: PASSWORD



